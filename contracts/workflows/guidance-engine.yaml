schema_version: "0.1"
workflow:
  id: "guidance-engine"
  phases:
  - "anytime"
  trigger:
  - "the host must interpret the latest user intent and choose one eligible practice"
  - "the user changes direction, expresses doubt, gives feedback, or asks how to approach a problem"
  inputs:
  - "latest user message"
  - "active objective"
  - "Current Work summary"
  - "journey guidance and lifecycle stage"
  - "bounded eligible practice summaries"
  - "relevant evidence only when the choice needs it"
  steps:
  - "classify the intent before repeating an earlier recommendation"
  - "choose zero or one eligible practice from the bounded status summaries"
  - "open guide detail only for a practice that may actually help"
  - "explain the selection in simple language and keep research proportional to uncertainty"
  - "do not mutate durable state merely because a practice was recommended"
  - "use the Current Work update interface only after the human accepts a semantic change"
  outputs:
  - "selected practice and reason, or an explicit decision that none is needed"
  - "one alternative only when it materially changes the approach"
  - "simple next action"
  - "whether an accepted Current Work update is needed"
  done_when:
  - "one appropriate eligible practice, or no practice, is explicit"
  - "the human understands why"
  - "the full catalog was not dumped into context"
  blocked_when:
  - "the choice requires a real taste, scope, or risk decision from the human"
  handoff:
  - "preserve the accepted practice, reason, and next step only when their meaning was accepted"
