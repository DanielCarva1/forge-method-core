schema_version: "0.1"
workflow:
  id: "start-runtime"
  phases:
  - "0-route"
  trigger:
  - "user asks to initialize or resume Forge through the installed runtime"
  - "user asks to create, select, or continue a Forge project"
  inputs:
  - "current workspace path"
  - "forge-core start result"
  - "at most one published workflow resume summary when start requires it"
  steps:
  - "resolve the supported installed runtime through the host adapter"
  - "run forge-core start --root <path> --json"
  - "follow the exact continuation returned by start; run at most one resume and never two consecutive resumes"
  - "explain the project, objective, lifecycle stage, Current Work, and next step in simple language"
  - "when setup is required, follow only the exact initialization or publication actions returned by the runtime"
  - "do not create hand-authored state files or scan broad project documentation"
  outputs:
  - "installed runtime selection"
  - "start and optional resume readback"
  - "concise human orientation"
  - "exact next command when one is required"
  done_when:
  - "the project is resolved"
  - "the objective, lifecycle stage, and Current Work state are known"
  - "one next valid step is clear"
  blocked_when:
  - "target directory is unsafe or ambiguous"
  - "the human must choose between multiple projects"
  - "the installed runtime is unsupported"
  handoff:
  - "reuse the current resume summary until a successful durable mutation makes it stale"
