schema_version: "0.1"
workflow:
  id: "doc-index"
  phases:
  - "anytime"
  trigger:
  - "user asks to index docs"
  - "large docs need navigation for future agents"
  inputs:
  - "documentation root"
  - "audience or use case"
  - "existing context map"
  - "important artifacts"
  - "source-of-truth and generated-doc rules"
  steps:
  - "discover docs and classify by purpose"
  - "read docs before describing them; do not infer purpose from filenames"
  - "identify source-of-truth files, generated docs, stale duplicates, and precedence rules"
  - "avoid creating an index when the existing documentation is already small and directly navigable"
  - "consolidate duplicate content into its canonical source and assign each remainder an explicit preserve, archive, or delete disposition"
  - "require explicit approval before destructive cleanup unless the file is a Forge-owned temporary created by the current operation"
  - "record source fingerprint, source mtime, compact descriptions, and navigation rules"
  - "update the existing canonical index only when it provides navigation value; create one only when no canonical index exists"
  outputs:
  - "updated canonical doc index when needed"
  - "stale/duplicate dispositions"
  - "navigation guidance"
  - "source fingerprint and stale-check proof"
  done_when:
  - "key docs are findable"
  - "source-of-truth boundaries are clear"
  - "index descriptions are content-derived"
  - "no unnecessary index or duplicate source of truth was created"
  - "each stale or duplicate document has a safe explicit disposition"
  - "stale-check proof passes or a waiver is explicit"
  - "future agents know what to read first"
  blocked_when:
  - "documentation root is unavailable"
  - "ownership/source-of-truth cannot be determined"
  - "source doc is newer than the index artifact and no update was made"
  handoff:
  - "preserve canonical documentation paths, source-of-truth rules, index path when useful, source fingerprint, unresolved dispositions, and next doc action"
