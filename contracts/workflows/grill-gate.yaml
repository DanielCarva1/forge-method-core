schema_version: "0.1"
workflow:
  id: "grill-gate"
  phases:
  - "1-discovery"
  - "2-specification"
  - "3-plan"
  trigger:
  - "an accepted discovery, specification, or plan decision needs adversarial challenge before advancing"
  - "the user asks to grill a decision or plan"
  inputs:
  - "accepted decision or meaning being challenged"
  - "active objective and lifecycle stage objective"
  - "acceptance criteria and non-goals"
  - "relevant CONTEXT or ADR only when the decision implicates it"
  - "current evidence and uncertainty"
  steps:
  - "restate the accepted decision in one compact paragraph"
  - "identify contradictions, missing definitions, risky assumptions, and irreversible choices"
  - "consult current artifacts only when the challenge needs them"
  - "ask the human only for an irreducible product or risk decision"
  - "keep the exchange ephemeral until the result is accepted"
  - "after acceptance, update the existing canonical artifact or Current Work owner instead of creating a duplicate document"
  outputs:
  - "challenged decision"
  - "resolved assumptions"
  - "remaining risks and one next step"
  - "canonical reference only when a durable update is needed"
  done_when:
  - "the decision is internally consistent"
  - "material uncertainty is explicit and dispositioned"
  - "no artifact was created before agreement"
  - "the next lifecycle step is supported"
  blocked_when:
  - "a real product, scope, promise, or risk decision remains with the human"
  handoff:
  - "preserve only the accepted decision, remaining risks, canonical reference, and next step"
