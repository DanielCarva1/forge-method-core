schema_version: "0.1"
workflow:
  id: "creative-session"
  phases:
  - "1-discovery"
  trigger:
  - "user asks for brainstorming, innovation, design thinking, storytelling, or creative direction"
  - "state.module == creative-studio"
  inputs:
  - "creative question"
  - "target audience"
  - "constraints"
  - "desired output format"
  - "optional prior artifacts"
  steps:
  - "{'identify creative mode': 'brainstorm, design-thinking, innovation, storytelling, or presentation'}"
  - "generate divergent options"
  - "cluster and label options"
  - "apply selection criteria"
  - "keep exploratory options and unused research ephemeral unless a rejection reason prevents a known product mistake"
  - "ask for user agreement between materially different directions"
  - "after agreement, update the existing canonical product artifact or create one only when no source of truth exists"
  outputs:
  - "selected direction"
  - "canonical artifact reference when agreement is promoted"
  - "decision-relevant rejection reason when needed"
  - "next action"
  done_when:
  - "the agreed direction or explicit no-decision result is clear"
  - "no durable artifact was created before agreement"
  - "an agreed result updated one canonical source instead of creating a duplicate"
  - "next workflow is known"
  blocked_when:
  - "user preference is required between materially different directions"
  - "target audience or output format is missing"
  handoff:
  - "preserve the agreed direction, canonical artifact reference when updated, material rejection reason when needed, and next workflow"
