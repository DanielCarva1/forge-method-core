schema_version: "0.1"
workflow:
  id: "brainstorming"
  phases:
  - "1-discovery"
  trigger:
  - "user asks for many ideas or directions"
  - "state.module == creative-studio"
  inputs:
  - "creative question"
  - "constraints"
  - "audience"
  - "selection criteria"
  steps:
  - "generate diverse options"
  - "if ideas stall or converge too early, optionally use inversion, analogy, constraint shift, assumption removal, or random stimulus"
  - "optionally research an unfamiliar technique when it is likely to improve the session"
  - "cluster related ideas"
  - "mark risky, safe, strange, and promising options"
  - "select candidates for deeper work"
  - "keep ordinary exploration ephemeral; persist only an agreed direction or a rejection reason that prevents a known product mistake"
  - "when agreement exists, update the existing canonical product artifact instead of creating a duplicate"
  outputs:
  - "ephemeral idea set"
  - "ephemeral clusters"
  - "candidate directions for user agreement"
  done_when:
  - "options are meaningfully different"
  - "selection criteria are applied"
  - "next creative workflow is known"
  blocked_when:
  - "prompt lacks audience or constraint"
  - "options cannot be compared"
  handoff:
  - "preserve only the agreed direction, decision-relevant criteria, canonical artifact reference when updated, and next workflow"
