schema_version: "0.1"
workflow:
  id: "guide-route"
  phases:
  - "anytime"
  trigger:
  - "the user asks where the product is in the lifecycle or what accepted step comes next"
  - "Current Work and a governed runtime action appear to point in different directions"
  inputs:
  - "active objective"
  - "journey guidance from the latest resume summary"
  - "Current Work summary"
  - "conditional recommended governance actions"
  - "focus-scoped blockers and global diagnostics"
  steps:
  - "establish the lifecycle stage and whether Current Work is active or terminal"
  - "choose one primary next step in the user's product journey"
  - "treat a governance action as conditional instead of competing with the journey step"
  - "distinguish blockers bound to Current Work from global diagnostics"
  - "use exact read-only detail commands only when the summary is insufficient"
  - "do not run a second resume until a successful durable mutation occurs"
  outputs:
  - "simple lifecycle-stage explanation"
  - "one primary next step"
  - "required human decision when one exists"
  - "exact optional command for bounded detail"
  done_when:
  - "one clear next step is visible without competing queues"
  - "any required human choice is explicit"
  - "no broad documentation scan occurred"
  blocked_when:
  - "an irreducible product choice or irreversible external effect needs the human"
  handoff:
  - "reuse the latest resume summary until durable state changes"
