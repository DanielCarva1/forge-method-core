implementation_decisions:
  readiness_profiles:
    - id: "solo_cooperative"
      purpose: "default and only current executable profile for the first dogfood milestone"
      current_executable: true
      readiness_state: "active_implementation"
      evidence_boundary: "cooperative_same_owner; never independent, human-origin, trusted-runtime, publication, or field proof"
      closure_blockers: []
      authority_model: >-
        One owner delegates work to cooperative agents and accepts
        agent-carried conversation provenance without claiming unforgeable
        proof of human presence or actor independence.
      admission_rule: >-
        Cooperative authority may progress solo-scoped claims when the packet,
        project snapshot, principal, provenance, and evidence bindings are
        current and complete.
    - id: "strict_external"
      purpose: "later team and enterprise authority profile"
      current_executable: false
      readiness_state: "later_stage_closed"
      admission_state: "closed"
      evidence_boundary: "new separated-origin, independent-review, and trusted-runtime evidence is required; retained strict history is not solo proof"
      authority_model: >-
        Human, reviewer, or runtime origin is established outside the governed
        agent process through separated custody and administration.
      admission_rule: >-
        Existing external broker and separation-domain requirements remain
        mandatory for claims that explicitly require independent authority.
  activation:
    scope: "current human-agent chat"
    rule: >-
      A successful or already-initialized start activates Forge behavior for the
      entire chat. Internal task boundaries, policy changes, retries, handoffs,
      and phase changes do not require another invocation.
    new_chat_rule: >-
      During the alpha, the human explicitly invokes the start skill once in
      each new chat. Automatic host activation is not required.
    repeated_invocation: "idempotent resume; never a new authority epoch by itself"
    guided_orientation:
      language_rule: >-
        Keep explanatory prose in the language already used by the human. Exact
        commands and identifiers may retain their source spelling, but the agent
        does not alternate languages in the surrounding explanation.
      explanation_rule: >-
        Technical details remain available and are paired with their practical
        meaning so that a non-technical project owner can understand project
        health, the next step, and whether human input is needed.
      continuation_rule: >-
        Orientation is not a stopping point. When a safe highest-ranked action is
        feasible within agent autonomy, the agent performs and verifies it in the
        same turn rather than merely announcing future work.
      question_rule: >-
        Ask exactly one concise question only for a genuine product choice,
        material trade-off, material risk acceptance, or irreversible/external
        effect; otherwise continue without asking.
      uncertainty_research_rule: >-
        During development, the agent identifies consequential uncertainty,
        researches it autonomously without waiting for a human instruction,
        compares competing hypotheses and contrary evidence, explains the
        product impact, and continues with the next safe action. Only a remaining
        product choice, material trade-off, material risk acceptance, or
        irreversible/external effect returns to the human.
  conversation_derived_intent:
    reuse: >-
      Extend the existing packet-bound local authorization seam rather than
      create a second intent store or accept free-form transcript text as
      authority.
    accepted_content:
      - "desired outcome"
      - "constraints and preferences"
      - "unacceptable outcomes"
      - "material decisions and their rationale"
      - "remaining uncertainty"
    provenance: >-
      Record a redacted conversation reference, host kind, chat-local
      interaction reference when available, carrying principal, packet digest,
      project snapshot, and acceptance time. Do not require transcript storage.
    honesty_rule: >-
      The resulting record proves durable cooperative acceptance, not
      unforgeable human presence.
    ambiguity_rule: >-
      The agent asks for clarification only when ambiguity changes value,
      material scope, material risk, or an irreversible or external effect.
  human_decision_boundary:
    requires_human:
      - "change to product objective or success definition"
      - "material trade-off among valid outcomes"
      - "acceptance of material unresolved risk"
      - "irreversible, external, production, publication, or secret-bearing action"
    delegated_to_agent:
      - "research and investigation"
      - "planning and decomposition"
      - "implementation and refactoring strategy"
      - "local reversible file edits"
      - "local tests, inspections, and readbacks"
      - "documentation and evidence generation"
      - "retries and course correction within the accepted objective"
  evidence_admission:
    rule: >-
      Reuse existing claim, evaluator, provenance, subject, freshness, and
      admission checks. Replace independence as a universal prerequisite with a
      claim-declared requirement.
    solo_evidence_label: "cooperative_same_owner"
    must_not_claim:
      - "independent semantic review"
      - "independent runtime execution"
      - "unforgeable human presence"
      - "enterprise compliance"
    strong_local_evidence:
      - "representative execution"
      - "authoritative business or runtime readback"
      - "negative and adversarial cases"
      - "cleanup or rollback verification"
      - "package and installation proof"
  mutation_boundary:
    decision: "free isolated work, governed canonical promotion"
    working_rule: >-
      Agents may iterate autonomously inside assigned worktrees and reversible
      local environments. Forge does not mediate every edit.
    promotion_rule: >-
      A canonical promotion is one governed operation bound to source and
      destination snapshots, exact diff, objective and claim coverage, required
      evidence, declared write set, authorization, transaction, readback, and
      receipt.
    conflict_rule: >-
      Destination drift, overlapping active ownership, out-of-scope effects,
      missing evidence, stale authority, and failed readback block promotion
      without partial canonical mutation.
    recovery_rule: >-
      Promotion reuses prepared execution, replay protection, write-ahead
      intent and commit ordering, idempotent recovery, and durable provenance.
  continuity:
    source_of_truth: >-
      The workflow ledger and admitted artifacts, not hidden chat history or a
      hand-edited status summary.
    resume_projection:
      - "active readiness profile"
      - "accepted objective and superseded objective history"
      - "current project and canonical repository snapshots"
      - "active agents and worktree ownership"
      - "open obligations, decisions, risks, and capability gaps"
      - "admitted and rejected evidence"
      - "pending or recovered promotions"
      - "ranked next action with rationale"
  host_support:
    principle: "support is capability-scoped, versioned, and evidence-backed"
    open_world_rule: >-
      Forge core recognizes capabilities and conformance results, not a closed
      whitelist of host brands. A new host can implement the versioned adapter
      contract, run the public corpus, and publish evidence without a Forge core
      release.
    project_root_resolution:
      global_claim: "canonical project root resolution"
      windows_to_wsl_bridge: >-
        Conditional transport seam used only when the host process runs on
        Windows and the canonical project root is inside WSL. Native and other
        host/platform combinations prove the same global project-root claim
        without being required to traverse a Windows-to-WSL bridge.
    initial_candidates:
      - "Codex"
      - "ZCode"
      - "OpenCode"
      - "Claude"
      - "Pi.dev"
      - "Cursor"
    outcome_vocabulary:
      - "supported"
      - "partially_supported"
      - "unsupported"
    honesty_rule: >-
      A candidate receives an outcome for each required capability. Missing
      host APIs produce typed gaps and never weaken the solo profile or inflate
      generic support.
    required_claims:
      - "skill activation"
      - "canonical project root resolution"
      - "read-only guidance"
      - "conversation-derived intent binding"
      - "cooperative evidence admission"
      - "isolated work ownership"
      - "governed canonical promotion"
      - "replacement-agent recovery"
  delivery_sequence:
    - id: "SD-00"
      title: "Make readiness and CI claims honest"
      outcome: >-
        Solo Dogfood Ready, strict external readiness, and partial host
        capabilities are separate public states; mandatory gates cannot be
        hidden behind allowed failures.
    - id: "SD-01"
      title: "Bind one objective from chat"
      outcome: >-
        One start invocation plus ordinary chat produces a durable accepted
        objective under solo cooperative authority with no human Forge command.
    - id: "SD-02"
      title: "Admit one representative solo evidence set"
      outcome: >-
        The agent runs and admits evidence sufficient for a solo-scoped claim
        while the projection explicitly withholds independence claims.
    - id: "SD-03"
      title: "Promote one isolated change"
      outcome: >-
        An agent iterates in a worktree and Forge atomically promotes the exact
        verified change to the canonical repository or leaves it unchanged.
    - id: "SD-04"
      title: "Resume with a replacement agent"
      outcome: >-
        A fresh process recovers the objective, evidence, work ownership,
        promotion state, and next action without transcript dependence.
    - id: "SD-05"
      title: "Ship the host-neutral conformance kit"
      outcome: >-
        Any host can execute the same clean packaged solo journey and produce a
        capability-scoped evidence bundle without Forge core changes.
    - id: "SD-06"
      title: "Conform the initial host candidates"
      outcome: >-
        Codex, ZCode, OpenCode, Claude, Pi.dev, and Cursor each complete the
        public corpus or receive an honest typed gap for every unsupported
        capability.
    - id: "SD-07"
      title: "Gate the packaged journey"
      outcome: >-
        CI hard-fails when the supported solo journey, platform package, WSL
        bridge, or recovery proof fails.
    - id: "SD-08"
      title: "Sustain real dogfood"
      outcome: >-
        Multiple non-trivial Forge changes are completed through the same
        public path, and observed friction becomes governed product work.

testing_decisions:
  quality_rule: >-
    Tests assert externally visible behavior, durable state, canonical
    readback, failure semantics, and recovery. They do not pass merely because
    a schema parses, an artifact exists, or a command returns success.
  highest_end_to_end_seam: >-
    Start once, converse normally, accept an objective, implement in an
    isolated worktree, admit representative evidence, promote to canonical
    state, restart with a replacement agent, and recover the exact next action.
  focused_seams:
    - seam: "packet-bound workflow authority"
      reason: >-
        It already owns current-state authorization, closed semantic input,
        ledger progression, and receipts, so conversation-derived intent should
        extend it rather than create parallel authority.
    - seam: "governed canonical promotion"
      reason: >-
        It is the narrowest boundary that controls real project mutation while
        preserving free agent iteration.
  required_scenarios:
    - "fresh chat activation and healthy resume"
    - "greenfield orientation summarizes seed material and asks one outcome question"
    - "existing unmanaged project is explained before Forge setup repair"
    - "existing managed project resumes with recent work, plan, gap, and next step"
    - "state-loss or integrity failure preserves prior records and explains one safe repair path"
    - "runtime or host-bridge failure still provides read-only project orientation"
    - "consequential uncertainty triggers autonomous research without waiting for a human instruction"
    - "human-facing prose stays in the human's language and pairs technical facts with practical meaning"
    - "no second start across task and phase changes in one chat"
    - "idempotent repeated start"
    - "unambiguous acceptance from ordinary chat"
    - "material ambiguity produces one concise Decision Request"
    - "agent-autonomous reversible action proceeds without human confirmation"
    - "objective correction preserves supersession history"
    - "stale packet and stale project snapshot rejection"
    - "cooperative evidence admitted without independent-review claim"
    - "evidence subject mismatch, freshness failure, and fabricated result rejection"
    - "worktree source and canonical destination snapshot binding"
    - "destination drift and overlapping write-set rejection"
    - "crash before promotion commit leaves canonical state unchanged"
    - "crash after commit recovers one receipt without duplicate effects"
    - "replacement process resumes without transcript content"
    - "canonical project root resolution on every advertised host/platform combination"
    - "conditional Windows-to-WSL bridge when a Windows host targets a canonical WSL project"
    - "CI workflow is red when any mandatory dogfood job fails"
  prior_art:
    - "workflow governance golden-path and action-packet end-to-end tests"
    - "prepared execution, operation-wide transaction, replay, and provenance recovery tests"
    - "trusted MCP single-effect and operation-wide execution tests"
    - "replacement-agent continuity scenarios"
    - "platform package and reference-journey CI jobs"
  release_evidence:
    minimum_consecutive_runs: 3
    rule: >-
      A release may claim Solo Dogfood Ready only after consecutive clean runs
      of the packaged end-to-end journey on every advertised host capability
      and platform boundary, followed by at least one real non-fixture Forge
      improvement through the released path.

out_of_scope:
  - "enterprise compliance certification or compliance marketing claims"
  - "cryptographic proof that a chat message was typed by a human"
  - "independent reviewer or trusted runtime separation for solo-scoped claims"
  - "same-operating-system-user confinement against a malicious agent"
  - "multi-organization key management, enrollment, rotation, and revocation UX"
  - "automatic Forge activation in every new chat"
  - "native Windows Forge runtime support"
  - "claiming support for capabilities that a host cannot expose or prove"
  - "mediation of every intermediate file edit"
  - "publication, push, merge, deployment, production mutation, or secret use without explicit human confirmation"
  - "silent conversion of solo evidence into stricter assurance"

further_notes:
  product_sequence:
    - "solo developer plus cooperative agents"
    - "small teams"
    - "medium teams"
    - "enterprise and compliance"
  assurance_epoch_rule: >-
    Moving a project from solo_cooperative to strict_external opens a new
    assurance epoch. Existing records remain valid for their original claims
    and provenance but do not satisfy newly introduced independence
    requirements.
  terminology_rule: >-
    User-facing diagnostics must describe the missing binding or capability,
    for example objective from conversation not yet bound to the ledger,
    instead of implying that the human failed to express intent.
  roadmap_relationship: >-
    This specification defines the first product-readiness milestone and should
    become the first executable vertical slice of the active product gap plan.
    Strict host-origin broker work remains valuable but moves off the solo
    dogfood critical path.
  canonical_decision_basis:
    - "cooperative agents in one repository are the current threat model"
    - "origin-bound signatures and separated authority are additive at a later trust boundary"
    - "the Rust core remains host-neutral and model-neutral"
    - "host support is open-world and conformance-based, never a brand whitelist"
    - "the human remains in chat and does not operate Forge artifacts"
