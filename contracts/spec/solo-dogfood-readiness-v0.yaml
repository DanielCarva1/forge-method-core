      evidence_boundary: "cooperative_same_owner evidence may satisfy only solo-scoped claims and never proves human origin, reviewer independence, trusted-runtime separation, publication, or field use"
      excluded_closure_prerequisite_ids: ["selected_host", "external_human_origin_broker", "independent_reviewer", "trusted_runtime"]
    strict_external:
      current_executable: false
      readiness_state: "later_stage_closed"
