    publication: "closed"
    field_evidence: "closed"
    independent_review: "closed"
  closure_rule: >-
    Close Solo Dogfood Ready only through SD-00 through SD-08 under
    solo_cooperative evidence. Selected-host, external human-origin,
    independent-reviewer, and trusted-runtime brokers do not block that closure;
    they remain mandatory and closed for strict_external claims.

problem_statement: >-
  Forge has substantial typed governance, evidence, continuity, transaction,
  and recovery machinery, but its ordinary development journey currently
  requires authority guarantees that a solo developer using cooperative host
  agents cannot supply through normal chat. The result is a product that can
  explain the next action yet blocks before durably accepting the objective,
  admitting ordinary development evidence, or promoting agent changes. The
  human is exposed to broker and registry concerns that belong to later
  multi-owner or enterprise trust boundaries. Named integrations such as
  Codex, ZCode, OpenCode, Claude, Pi.dev, and Cursor are only candidates. The
  current dogfood runtime is installed natively on Windows, while WSL remains a
  conditional project-root and runner boundary. The current CI presentation can
  report overall success while important platform or journey jobs fail. This
  prevents the creator from using Forge to improve Forge through the intended
  one-command, chat-native experience.

solution: >-
  Introduce a first-class solo_cooperative readiness profile that reuses the
  existing workflow ledger, action packets, admission, evidence, WAL, receipts,
  recovery, and worktree isolation while making honest cooperative authority
  sufficient for solo dogfooding. The human invokes the Forge start skill once
  per chat. The host agent then binds objectives and material decisions from
  ordinary conversation, autonomously researches and iterates in an isolated
  worktree, admits provenance-bearing evidence without claiming independent
  review, and uses Forge to govern promotion into the canonical repository.
  External human-origin, independent-reviewer, trusted-runtime, and
  compliance-grade brokers remain additive stricter profiles for later product
  stages rather than blockers for the solo journey.

success_definition:
  milestone: "Solo Dogfood Ready"
  target_user: "one repository owner working with one or more cooperative agents"
  activation: "one Forge start skill invocation per human-agent chat"
  human_forge_commands: 0
  host_model: >-
    Open-world and capability-scoped: any host may become supported by passing
    the same versioned conformance contract without requiring host-name logic
    in the Forge core.
  initial_host_candidates:
    - "Codex"
    - "ZCode"
    - "OpenCode"
    - "Claude"
    - "Pi.dev"
    - "Cursor"
  end_to_end_outcome: >-
    Starting from a normal chat request, a fresh supported host agent can
    recover project truth, bind the current objective, implement and verify an
    isolated change, request only irreducible human decisions, promote the
    accepted change through Forge, and leave sufficient durable state for a
    replacement agent to continue without hidden transcript context.

user_stories:
  - id: "US-001"
    story: >-
      As a solo developer, I want to invoke the Forge start skill once when I
      open a chat so that Forge remains active without repeated setup commands.
  - id: "US-002"
    story: >-
      As a solo developer, I want task, phase, retry, and implementation changes
      inside the same chat to preserve Forge activation so that the protocol
      does not become conversational friction.
  - id: "US-003"
    story: >-
      As a solo developer, I want a repeated start invocation to be idempotent
      so that accidental reactivation cannot erase or fork project authority.
  - id: "US-004"
    story: >-
      As a solo developer, I want to state objectives, constraints, preferences,
      and corrections in ordinary chat so that I never need to author Forge
      YAML, JSON, signatures, registry entries, or broker commands.
  - id: "US-005"
    story: >-
      As a solo developer, I want the agent to show its interpreted objective
      when ambiguity is material so that I can correct meaning before costly
      work proceeds.
  - id: "US-006"
    story: >-
      As a solo developer, I want an unambiguous conversational agreement to be
      bound durably to the current action packet and project state so that a
      replacement agent can recover what was accepted.
  - id: "US-007"
    story: >-
      As a solo developer, I want conversational corrections to supersede prior
      intent explicitly rather than silently rewriting history so that changes
      of direction remain understandable.
  - id: "US-008"
    story: >-
      As a solo developer, I want Forge to ask me only about product objectives,
      material trade-offs, material risk acceptance, and irreversible or
      external actions so that the agent remains genuinely autonomous.
  - id: "US-009"
    story: >-
      As a host agent, I want to choose research, implementation, refactoring,
      test, documentation, and retry strategies without human approval so that
      Forge scales with agent capability instead of scripting it.
  - id: "US-010"
    story: >-
      As a host agent, I want to perform reversible local work without a Forge
      confirmation for every file edit so that iterative development remains
      fast.
  - id: "US-011"
    story: >-
      As a host agent, I want a typed explanation when Forge blocks an action so
      that I can remediate it without exposing internal governance machinery to
      the human.
  - id: "US-012"
    story: >-
      As a solo developer, I want cooperative chat provenance recorded honestly
      so that Forge never claims cryptographic proof that the host cannot
      provide.
  - id: "US-013"
    story: >-
      As a solo developer, I want local tests, inspections, and readbacks to be
      admissible evidence when their provenance and subject bindings are valid
      so that normal development can progress.
  - id: "US-014"
    story: >-
      As a solo developer, I want evidence produced by the same cooperative
      agent to remain distinguishable from independent review so that readiness
      claims are not overstated.
  - id: "US-015"
    story: >-
      As a host agent, I want to work freely in an isolated worktree so that
      experimentation and repair do not mutate the canonical repository
      prematurely.
  - id: "US-016"
    story: >-
      As a solo developer, I want Forge to govern the promotion boundary rather
      than every intermediate edit so that canonical changes are controlled
      without choking agent iteration.
  - id: "US-017"
    story: >-
      As a solo developer, I want a promotion to bind the accepted objective,
      source and destination snapshots, exact diff, required evidence, declared
      effects, and resulting receipt so that I can audit what entered the
      canonical repository.
  - id: "US-018"
    story: >-
      As a host agent, I want stale, conflicting, or out-of-scope promotions to
      fail before canonical mutation so that concurrent work cannot be admitted
      against the wrong state.
  - id: "US-019"
    story: >-
      As a host agent, I want interrupted promotion to recover idempotently so
      that a crash cannot leave canonical state and Forge authority disagreeing.
  - id: "US-020"
    story: >-
      As a replacement agent, I want to resume the active objective, decisions,
      unresolved obligations, evidence, worktree, and next action from durable
      Forge state so that hidden chat history is not required.
  - id: "US-021"
    story: >-
      As a solo developer, I want multiple cooperative agents to have explicit
      identities and isolated work without pretending they are independent
      compliance reviewers so that parallel work remains traceable.
  - id: "US-022"
    story: >-
      As a host user on Windows, I want the start skill and agent to operate the
      canonical WSL repository without copying it to a Windows filesystem so
      that the currently working runtime can be dogfooded from my chosen host.
  - id: "US-023"
    story: >-
      As a host integrator, I want any capable host to run the same conformance
      journey without Forge core changes so that support is based on observed
      behavior rather than a hard-coded host name.
  - id: "US-024"
    story: >-
      As a solo developer, I want host support reported independently for
      activation, read-only guidance, conversation-derived intent, evidence
      admission, governed promotion, and recovery so that partial support is
      not marketed as complete.
  - id: "US-025"
    story: >-
      As a maintainer, I want the Solo Dogfood end-to-end journey to be a
      mandatory hard-fail CI gate so that a green workflow cannot hide a broken
      core journey.
  - id: "US-026"
    story: >-
      As a maintainer, I want the CI journey to exercise packaged artifacts on
      supported host and WSL boundaries so that source-only tests are not
      confused with installable product proof.
  - id: "US-027"
    story: >-
      As the Forge creator, I want real Forge improvements to be delivered
      through this profile repeatedly so that readiness is established by
      sustained dogfooding rather than one scripted demonstration.
  - id: "US-028"
    story: >-
      As a future team adopter, I want stricter authority profiles to be
      additive and epoch-separated so that solo evidence is preserved honestly
      but never silently upgraded into independent or enterprise evidence.

