      retained_item_projection:
        applies_to_each_item: true
        disposition: "preserved_later_stage"
        evidence_boundary: "retained source and checkpoint history remains valid only for its original strict_external claims and is never solo completion evidence"
      retained_item_ids: ["C1.1", "C1.2", "C1.3", "C1.4", "C2.1", "C2.2", "C2.3", "C2.4", "C3.1", "C3.2", "C3.3", "C3.4", "C4.1", "C4.2", "C5.1", "C5.2", "C5.3", "C6.1", "C6.2", "C7.1", "C7.2"]
  later_closed_boundaries:
