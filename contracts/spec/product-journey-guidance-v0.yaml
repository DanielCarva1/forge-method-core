schema_version: "0.1"
artifact_kind: "product-journey-guidance-specification"
contract_id: "spec.product-journey-guidance-v0"
status: "draft"
created_at: "2026-08-12"

source:
  discovery: "contracts/discovery/product-journey-recovery-discovery.yaml"
  research: "docs/research/agent-orchestration-and-proportional-journeys.md"
  prior_design:
    - "contracts/plan/slice-2-orchestrator-plan.yaml"
    - "contracts/spec/engine-architecture.yaml"
  current_runtime:
    - "crates/forge-core-contracts/src/phase.rs"
    - "crates/forge-core-contracts/src/catalog.rs"
    - "crates/forge-core-contracts/src/guide_decision.rs"
    - "crates/forge-core-decisions/src/catalog.rs"
    - "crates/forge-core-decisions/src/funnel_autonomy.rs"
    - "crates/forge-core-kernel/src/guide_protocol.rs"
    - "crates/forge-core-cli/src/guide.rs"
    - "crates/forge-core-cli/src/workflow_cmd.rs"

purpose: >-
  Reconnect Forge's fixed product-development lifecycle, proportional autonomy
  funnel, runtime-owned capability catalog, host-agent reasoning, and
  deterministic governance through the normal start/resume journey without
  turning guidance into authority or loading the full catalog at startup.

product_contract:
  human_entry: "start-forge"
  lifecycle_rule: >-
    Every greenfield, brownfield, and Evolve cycle visits Analysis and
    Discovery, Product Planning, Solution Definition, Implementation, and
    Validation and Delivery. The amount of work in a stage is proportional;
    the stage is not silently removed.
  workflow_rule: >-
    A workflow is a directional practice within a stage. It carries an
    objective, applicability signals, inputs, suggested activities, outputs,
    completion conditions, blocked conditions, and handoff context. It does not
    script the host agent or grant authority.
  autonomy_rule: >-
    Human-agent contact is high while intent and product decisions are being
    formed, then decreases as the product contract becomes settled. New
    material uncertainty reopens the appropriate human conversation rather
    than allowing blind execution.
  evolve_rule: >-
    Evolve is entered after a stable product when the user wants a material
    change. It records that trigger and immediately starts a new cycle in
    Analysis and Discovery using the existing product and feedback as context.
    No feature development happens inside Evolve.

proportional_cycle_model:
  rule: >-
    Forge exposes one Product Lifecycle rather than separate lightweight and
    heavyweight methods. A clear, bounded, reversible change starts as a Quick
    Cycle: every lifecycle stage is visited, but its closeout is compressed into
    one small durable record. Evidence can expand the affected stage without
    restarting or expanding the whole cycle by default.
  artifact_hygiene:
    rule: >-
      Exploration is ephemeral by default. Forge promotes only an agreed result,
      decision-relevant constraint, or required evidence into durable project
      state, and the host updates the existing canonical source before creating
      another document for the same concern.
    cleanup_boundary:
      - "ordinary ideas, unused research, and facilitation techniques are not durable artifacts"
      - "a rejected direction is retained only when its reason prevents a known product mistake"
      - "destructive cleanup requires explicit approval unless it removes a Forge-owned temporary created by the current operation"
      - "startup does not scan or rewrite the project's documentation tree"
  quick_cycle_record:
    purpose: "preserve the complete reasoning path for small work without producing a stack of documents"
    owner: "Current Work Continuity through the existing Work Focus event chain"
    ownership_rules:
      - "focus_id identifies one task-local cycle; same-focus successors form its immutable previous-record-digest chain"
      - "a new focus_id starts a new cycle even when its predecessor, objective, and Phase are unchanged"
      - "the Work Focus objective and Phase are freshness bindings, not cycle identity, and the Quick Cycle payload does not copy them"
      - "the workflow-governance WAL remains the only durable store and expected-state comparison remains the only write path"
      - "canonical Phase remains global transition authority; a task-local closeout never advances Phase or completes a policy"
      - "decision and evidence bodies remain with their current owners and are referenced by digest rather than copied"
    fields:
      objective: "the one user-facing outcome already bound by the owning Work Focus"
      compactness_reason: "why a compact treatment is currently safe"
      stage_closeouts:
        analysis_discovery: "current behavior, problem evidence, relevant uncertainty, and why deeper discovery is unnecessary"
        product_planning: "desired behavior, success criteria, and non-goals"
        solution_definition: "affected boundaries, chosen approach, material risks, and why no larger design artifact is needed"
        implementation: "completed change and meaningful deviations from the plan"
        validation_delivery: "acceptance evidence, user-journey result, remaining limits, and delivery state"
      expansion_history: "append-only reasons that caused a stage to grow or the cycle to return"
    bounds:
      - "one active user-facing objective"
      - "closeouts are summaries backed by referenced evidence, not replacements for evidence"
      - "a stage may close immediately only when the host can explain why additional work cannot reasonably change the decision"
      - "compactness never removes a required authority, safety, evidence, or release gate"
      - "the complete Work Focus event remains within the existing 16 KiB bound and Current Work detail remains within 20 KiB"
      - "compactness_reason is at most 512 UTF-8 bytes"
      - "each of the five closeout summaries is at most 768 UTF-8 bytes"
      - "expansion_history contains at most four entries and each reason is at most 512 UTF-8 bytes"
      - "each closeout or expansion may cite at most two evidence digests, each already present in the owning Work Focus evidence set"
      - "when a fifth expansion is accepted, one superseding Work Focus with a new focus_id records that reason as its first expansion and links to the prior partial cycle; it does not invent terminal closeouts or copy the first four entries"
      - "implementation must fit these sub-bounds inside current total budgets; it must not raise a budget merely to fit copied prose"
    write_model:
      ordinary_compact_task: >-
        Accept one Work Focus with the compactness reason, then write all five
        closeouts together in the same terminal Work Focus update. Do not write
        one event per stage.
      legitimate_intermediate_write:
        - "an accepted Expansion Signal changes the treatment or sends work back to an earlier stage"
        - "a real replacement or context-recovery boundary needs accepted partial closeouts"
      new_cycle_triggers:
        - "a Cooperative Objective revision changes through its existing owner and makes the old Work Focus stale"
        - "a material correction supersedes the Work Focus with a new focus_id rather than rewriting the prior cycle"
        - "the bounded expansion history is full and one atomic superseding event carries the next accepted expansion as the first entry of a new focus_id"
      forbidden_write_triggers:
        - "ordinary messages, narration, tool calls, repository reads, or test progress"
        - "automatic stage bookkeeping when accepted meaning did not change"
      expansion_rule: >-
        Each same-focus successor may only preserve the existing ordered
        expansion-history prefix and append new entries. It cannot rewrite or
        remove an accepted expansion reason. A successor with a new focus_id
        starts a new cycle and links to, but never copies, the prior history.
  expansion_signals:
    - id: "unclear-intent"
      return_to: "analysis-discovery"
      example: "the requested behavior or affected user is still ambiguous"
    - id: "multiple-independent-goals"
      return_to: "analysis-discovery"
      example: "one request contains changes that can succeed or fail independently"
    - id: "missing-product-decision"
      return_to: "product-planning"
      example: "success criteria, user journey, or non-goal is not settled"
    - id: "broad-or-unknown-impact"
      return_to: "solution-definition"
      example: "the change crosses systems, ownership boundaries, or poorly understood code"
    - id: "architectural-choice"
      return_to: "solution-definition"
      example: "more than one meaningful design has different long-term costs"
    - id: "material-risk-or-irreversibility"
      return_to: "the earliest stage that owns the unresolved human or technical decision"
      example: "security, data, compatibility, money, external publication, or destructive effects are involved"
    - id: "validation-failure"
      return_to: "the stage where the failure originated"
      example: "wrong intent returns to discovery, wrong requirement to planning, wrong design to solution definition, and a local defect to implementation"
  human_checkpoints:
    - "clarify intent or make a material product decision while the contract is still forming"
    - "approve an expanded product or solution contract when the consequences justify explicit review"
    - "review the resulting user experience and remaining limits before final delivery"
  agent_autonomy:
    - "investigate, plan, implement, test, review, and document reversible local work between human checkpoints"
    - "expand a stage when evidence justifies it; do not ask the human to choose a process label"
    - "route a failed review back to the stage that introduced the mistake instead of repeatedly patching code"
    - "record unrelated findings as deferred work rather than silently expanding the active objective"

collaboration_model:
  purpose: >-
    Let one developer use cooperating agents without turning conversation,
    heartbeats, or tool calls into durable project state.
  routing_rule: >-
    Split only work that is independent and has a coherent outcome. Keep work
    with overlapping ownership or unresolved dependencies sequential.
  plan_owner: "the optional bounded collaboration plan inside Work Focus"
  lane_shape:
    required: ["lane_id", "outcome", "depends_on"]
    optional: ["isolation_id"]
    deliberately_derived:
      - "agent, branch, worktree, and path ownership from isolation and claim"
      - "readiness and blocking from dependencies plus current claims, isolations, and promotions"
      - "integration evidence from the existing promotion receipt"
  bounds:
    max_lanes: 8
    max_dependencies_per_lane: 7
    max_outcome_bytes: 256
    work_focus_event_budget_bytes: 16384
  write_model:
    - "accept or replace the bounded plan atomically under exact expected Work Focus state"
    - "write only when lane meaning, dependencies, assignment, or integration boundary materially changes"
    - "do not write for messages, model calls, tool calls, tests, progress narration, or heartbeats"
  progressive_readback:
    resume: "bounded counts plus the next ready lane, derived from owners already loaded for resume"
    detail: "exact lanes, dependencies, links, and derived owner state on demand"
    no_extra_scan: true
  worktree_guidance:
    safe_shape: "../.forge-worktrees/<agent>/<task>"
    rule: "reject or clearly flag a promotion-ineligible worktree path before active work begins"
  compatibility:
    - "absence means no collaboration plan and adds no ordinary Work Focus payload"
    - "AgentRunContract remains validation-only compatibility material, not a second runtime owner"
    - "claims, isolation, promotion, and Work Focus keep their current authority boundaries"

canonical_stage_mapping:
  source_of_phase_identity: "forge_core_contracts::Phase"
  no_second_phase_enum: true
  stages:
    - phase: "0-route"
      stage_id: "bootstrap-route"
      display_name: "Bootstrap"
      objective: "recover project identity, durable state, and the correct lifecycle entry"
      expected_contact_density: "medium"
      lifecycle_stage: false
    - phase: "1-discovery"
      stage_id: "analysis-discovery"
      display_name: "Analysis and Discovery"
      objective: "understand the person, problem, product, existing system, uncertainty, and promising directions"
      expected_contact_density: "high"
      lifecycle_stage: true
    - phase: "2-specification"
      stage_id: "product-planning"
      display_name: "Product Planning"
      objective: "turn the chosen direction into an agreed product contract with journeys, requirements, success criteria, and non-goals"
      expected_contact_density: "high"
      lifecycle_stage: true
    - phase: "3-plan"
      stage_id: "solution-definition"
      display_name: "Solution Definition"
      objective: "design the product and technical solution, assess impact, and split it into coherent increments"
      expected_contact_density: "medium"
      lifecycle_stage: true
    - phase: "4-build-verify"
      stage_id: "implementation"
      display_name: "Implementation"
      objective: "build the agreed increments with executable feedback, integration, and focused review"
      expected_contact_density: "low"
      lifecycle_stage: true
    - phase: "5-ready-operate"
      stage_id: "validation-delivery"
      display_name: "Validation and Delivery"
      objective: "prove the intended user journey and leave the product stable, usable, releasable, and observable"
      expected_contact_density: "low"
      lifecycle_stage: true
    - phase: "6-evolve"
      stage_id: "evolve-trigger"
      display_name: "Evolve"
      objective: "capture the user's next material change and reopen the lifecycle at Analysis and Discovery"
      expected_contact_density: "medium"
      lifecycle_stage: false
      transition_only: true
  validation:
    - "Every Phase variant has exactly one stage descriptor."
    - "Every descriptor's contact density equals the accepted funnel-autonomy profile for its Phase."
    - "Stage descriptors add product meaning but never alter Phase identity, rank, eligibility, or transition authority."
    - "Evolve is transition-only and cannot contain feature-development work."

module_design:
  module: "Product Journey Guidance"
  interface: >-
    One compact read-only journey_guidance value in workflow resume, plus
    phase-filtered catalog status and single-capability detail readbacks.
  implementation: >-
    An accepted lifecycle descriptor is loaded and validated in
    forge-core-decisions. A pure composition function joins one canonical Phase,
    its accepted funnel profile, and the embedded operational catalog. Adapters
    project the result; the kernel remains owner of gates and authority.
  depth: >-
    Callers learn one stage readback and two progressive catalog operations
    instead of joining Phase, funnel policy, workflow documents, retirement
    tombstones, and guide validation themselves.
  seam: "a pure read-only ProductJourneyGuidance derivation in forge-core-decisions"
  adapters:
    - "forge-core-cli workflow resume projection"
    - "forge-core-cli guide status and guide detail"
    - "start-forge host skill"
    - "future MCP or native-host adapter using the same contract"
  leverage: "one runtime-owned journey model serves every host and improves with stronger host agents"
  locality: "stage meaning and catalog composition change in their owners rather than in every host skill"
  deletion_test: >-
    Deleting this module would force every adapter to rediscover the stage map,
    funnel profile, catalog source, eligibility rules, and progressive commands.
    It therefore removes real caller complexity rather than wrapping one call.

authority_split:
  forge_deterministic:
    - "derive current Phase from durable project state"
    - "load and validate the accepted lifecycle descriptor"
    - "load the embedded operational catalog and retirement tombstones"
    - "filter capability eligibility by Phase"
    - "publish funnel contact density and exact read-only catalog commands"
    - "validate a later host recommendation against catalog, Phase, gates, and authority"
  host_agent_reasoning:
    - "interpret the latest conversation and repository reality"
    - "decide whether a stage needs a short or expanded treatment"
    - "choose which eligible capability is useful"
    - "choose research method, tools, sources, and depth"
    - "explain the recommendation simply to the user"
  human_decision:
    - "desired outcome and preferences"
    - "material product tradeoffs"
    - "risk acceptance and irreversible or external effects"
    - "whether a stable product should enter a new Evolve cycle"
  non_authority:
    - "journey guidance grants no mutation, phase transition, evidence admission, release, signing, trust, or human-origin authority"
    - "a host recommendation is not proof and cannot satisfy a governance claim"
    - "selected_policy_ref remains a governance concern and must not be relabeled as the current product-development practice"

resume_interface:
  containing_schema: "workflow_resume_summary_v10"
  migration: >-
    Journey guidance advanced v6 to v7. Current Work advances the containing
    summary to v8. Quick Cycle progressive readback advances it to v9. The
    event-driven catalog consultation handoff advances the containing summary
    to v10 and journey guidance to v2.
  field: "data.journey_guidance"
  value_schema: "product_journey_guidance_v2"
  required_shape:
    schema_version: "product_journey_guidance_v2"
    authority: "advisory_read_only"
    phase: "canonical Phase tag"
    stage:
      id: "stable stage id from the accepted lifecycle descriptor"
      display_name: "short agent-facing name"
      objective: "one bounded directional sentence"
      contact_density: "accepted funnel-autonomy value"
    catalog:
      eligible_count: "count of operational non-retired capabilities eligible in the phase"
      consultation:
        schema_version: "catalog_consultation_v1"
        key: "sha256 over project id, active objective digest, canonical Phase, and Work Focus id"
        host_action: "consult_once_when_unseen"
        recheck_events:
          - "material_human_redirect"
          - "validation_reveals_misunderstanding"
      status_argv: ["forge-core", "guide", "status", "--root", "<resolved-root>", "--phase", "<current-phase>", "--json"]
      detail_argv:
        argv: ["forge-core", "guide", "detail", "--workflow", "__FORGE_CAPABILITY_ID__", "--json"]
        workflow_id_token: "__FORGE_CAPABILITY_ID__"
    recommendation_owner: "host_agent"
    recommendation_is_authority: false
  compactness:
    - "Do not embed the full workflow catalog, retirement tombstones, active objective, policy simulation, or evidence again."
    - "Reuse top-level active_objective, current_evaluation, blockers, and actions by reference in host instructions rather than copying their bytes."
    - "The journey_guidance canonical JSON must remain at or below 2048 bytes for every Phase and valid project root."
    - "The host tracks consultation keys only in its current session; Forge writes no consultation state."
    - "Routine snapshots, ledger progress, reads, tests, and status checks cannot change the consultation key."
  independence:
    - "Changing selected_policy_ref while Phase, lifecycle descriptor, funnel policy, and catalog remain equal cannot change journey_guidance."
    - "Deleting or replacing an advisory workflow's steps cannot change governance simulation, verdicts, gates, claims, or authority."

progressive_catalog_interfaces:
  status:
    command: "forge-core guide status --root <root> --phase <phase> --json"
    before: "eligible rows contain only id and phases"
    after:
      schema_version: "guide_routing_payload_v0.3"
      eligible_row:
        id: "StableId"
        phases: "eligible phase tags"
        summary: "first applicability trigger, bounded"
      ordering: "ascending capability id"
      contents: "operational non-retired capabilities eligible in the requested Phase"
      excludes:
        - "full workflow steps"
        - "full inputs, outputs, completion, blocked, and handoff lists"
        - "retired workflows as eligible candidates"
    purpose: "give the host enough signal to choose a small candidate set without loading all workflow bodies"
  detail:
    command: "forge-core guide detail --workflow <id> --json"
    schema_version: "guide_capability_detail_v0.1"
    success_shape:
      id: "StableId"
      phases: "phase tags"
      applicability_signals: "workflow trigger"
      inputs: "workflow inputs"
      activities: "workflow steps"
      outputs: "workflow outputs"
      done_when: "workflow done_when"
      blocked_when: "workflow blocked_when"
      handoff: "workflow handoff"
      module: "optional workflow module"
    rules:
      - "Resolve from the same catalog/workflow-document owner used by guide describe."
      - "Reject unknown IDs with a typed diagnostic."
      - "Return a retirement diagnostic, not a routable detail, for a retired ID."
      - "Never infer applicability or recommend the capability."
      - "Never mutate project or sidecar state."
    purpose: "load the complete directional contract only after the host selects a plausible capability"

host_adapter_behavior:
  start_forge:
    - "Remain the only ordinary human initialization command."
    - "Bootstrap and resume exactly once according to the existing durable-state rule."
    - "Read journey_guidance after resume instead of carrying a copied lifecycle or capability catalog."
    - "Use contact_density to decide how much human conversation is expected, not to request procedural confirmation during autonomous stages."
    - "When catalog.consultation.key is unseen in the current host session, execute catalog.status_argv once, remember the key, reason over the latest conversation, then request detail only for a plausible capability."
    - "A material human redirect or validation that reveals an earlier misunderstanding may trigger one recheck even when the durable key is unchanged."
    - "Explain the selected practice and why it helps in simple language; do not expose catalog browsing as human work."
    - "Do not run research merely because a research capability exists. The host chooses it when uncertainty can change the decision."
    - "Begin with compact stage treatment and expand only when an explicit expansion signal is observed."
    - "Describe the reason for expansion in product language; do not ask the human to select Quick Cycle or Expanded Cycle."
    - "When validation finds an upstream mistake, return to the owning stage instead of hiding the problem in implementation patches."
  stale_or_unsupported_runtime:
    - "A host that receives workflow_resume_summary_v6 follows the v6 compatibility behavior and may use existing guide diagnostics as a temporary fallback."
    - "A host must not invent v7 fields or assume the installed catalog matches its skill text."

current_work_continuity:
  problem: >-
    The current resume can recover the active objective, lifecycle stage,
    governance policy, evidence, blockers, and available actions, but it cannot
    identify the bounded piece of product work the human and host agent are
    currently pursuing. A replacement agent must reconstruct that link from
    chat memory, GitHub, files, or guesses.
  historical_precedent:
    old_behavior: >-
      The pre-Rust host entry reran a route/context preflight, interpreted the
      latest substantive human message, and carried active story, task,
      checkpoint, and operation guidance.
    useful_property: "continuation started from durable project truth instead of conversation memory"
    rejected_restoration:
      - "do not rerun a semantic classifier for every human message"
      - "do not restore the monolithic Python runtime or its last-writer-wins state"
      - "do not reuse the current preflight name, which now owns readiness and quality checks"
      - "do not turn a work description into mutation or completion authority"
  concepts:
    work_focus: >-
      The currently accepted, bounded piece of work inside the active objective.
      It states the intended outcome and acceptance boundary and may reference an
      external issue without making that tracker Forge authority.
    current_work_context: >-
      A compact read-only projection composed from the active objective, Phase,
      active Work Focus, accepted practice, durable decisions, blockers,
      evidence summaries, and ranked next action.
  architecture:
    module: "Current Work Continuity"
    interface: >-
      One bounded current_work summary in workflow resume plus one progressive
      detail operation. The summary is enough to continue ordinary work; detail
      resolves the accepted Work Focus and its references without replaying the
      ledger or scanning project documentation.
    seam: "workflow-governance durable continuity projected through workflow resume"
    implementation: >-
      Persist only accepted semantic changes as append-only Work Focus events.
      Compose the readback from existing objective, phase, decisions, blockers,
      evidence, and actions rather than copying those records into the Work
      Focus. Keep semantic interpretation in the host agent and deterministic
      binding, freshness, bounds, and authority validation in Forge.
    adapters:
      - "forge-core-cli workflow resume summary"
      - "one CLI detail readback used only when the summary is insufficient"
      - "start-forge host adapter"
      - "future host adapters consuming the same contract"
    locality: >-
      Work-focus persistence and composition live with workflow continuity;
      lifecycle wording stays in Product Journey Guidance, catalog choice stays
      with the host agent, and execution authority stays in its existing kernel.
  quick_cycle_continuity:
    owner: "Work Focus"
    representation: >-
      An optional bounded Quick Cycle snapshot inside each Work Focus event.
      Historical or expanded work without that snapshot remains valid and is
      reported as not recorded; hosts must not reconstruct it from prose.
    identity:
      - "focus_id is the cycle identity"
      - "previous_work_focus_record_digest proves ordered same-focus successors but also links a new focus to its predecessor for navigation"
      - "objective and Phase remain freshness bindings and never merge cycles that have different focus_id values"
    active_shape:
      - "compactness reason accepted when the bounded focus starts"
      - "zero or more accepted partial closeouts only at a legitimate intermediate-write boundary"
      - "ordered append-only expansion entries identifying the canonical Phase, reason, and a subset of existing Work Focus evidence references"
    terminal_shape:
      - "all five lifecycle closeouts are present"
      - "validation and delivery states the user-journey result, remaining limits, and delivery state"
      - "the terminal Work Focus update carries the complete Quick Cycle snapshot in the same WAL record"
      - "the same terminal change carries the final top-level blocker and evidence sets, so binding references does not require a write before completion"
    bounded_overflow:
      - "a full four-entry expansion history remains a valid partial cycle and is never relabeled terminal"
      - "the next accepted Expansion Signal uses the existing atomic Work Focus supersession path"
      - "the superseding focus records the triggering reason as its first expansion and links the predecessor by digest"
      - "the same superseding input carries the new snapshot and final top-level blocker and evidence sets; nested references are validated as their subset"
      - "the supersession does not require a separate completion write, synthetic closeouts, or copied history"
    derived_values:
      - "compact when expansion history is empty; expanded when at least one accepted expansion exists"
      - "closed-stage and expansion counts are derived from the snapshot rather than separately authored"
    non_authority:
      - "a closeout is continuity evidence, not PhaseAdvanced, PolicyCompleted, release, merge, or mutation authority"
      - "a referenced evidence digest remains subject to its existing admission and claim semantics"
    reference_rule: >-
      Nested closeout or expansion evidence digests are indices into the final
      top-level Work Focus evidence set. The kernel rejects any nested digest
      absent from that set; nested references never admit evidence or create a
      second canonical list.
  progressive_readback:
    summary_fields:
      - "status: absent, current, stale, blocked, or completed"
      - "focus_ref and record_digest"
      - "bounded title and intended outcome"
      - "objective revision and Phase bindings"
      - "optional external_work_item_ref"
      - "optional selected_practice_ref"
      - "bounded current_activity and next_step"
      - "counts and references for open decisions, blockers, and evidence instead of copied bodies"
      - "optional bounded Quick Cycle state, closed-stage count, and expansion count without closeout prose"
      - "exact detail argv"
    detail_fields:
      - "acceptance summary and non-goals"
      - "canonical product or specification references"
      - "optional affected-area and external-work-item references"
      - "accepted practice and reason"
      - "durable decision, blocker, and evidence references"
      - "supersession and freshness bindings"
      - "compactness reason, five closeouts, and ordered expansion history when explicitly recorded"
      - "an exact bounded predecessor-detail argv when a prior Work Focus record exists"
    bounds:
      - "ordinary resume includes at most one active Work Focus"
      - "summary contains no transcript, full issue body, full evidence, full decision history, or catalog body"
      - "detail is bounded and uses references for larger canonical material"
      - "absence is valid before a focus is accepted; the host asks one useful product question instead of inventing work"
  update_triggers:
    persist:
      - "the human and host accept a new bounded focus inside the active objective"
      - "the intended outcome, acceptance boundary, or non-goals materially change"
      - "the lifecycle Phase changes and the old activity no longer describes the work"
      - "an accepted practice changes"
      - "a durable decision or blocker changes what should happen next"
      - "the focus completes, is superseded, or is explicitly abandoned"
      - "a replacement/context-recovery boundary needs an explicit continuation checkpoint"
      - "an accepted Expansion Signal changes the treatment or owning stage"
    do_not_persist:
      - "ordinary conversation that does not change the accepted meaning"
      - "raw brainstorm options, rejected facilitation ideas, or unused research"
      - "read-only inspection whose result does not alter the focus or next step"
      - "progress narration that is already observable from canonical evidence"
      - "passing from one compact lifecycle stage to the next without a material semantic change"
    host_rule: >-
      The host agent decides whether the latest message changes meaning. Forge
      validates the proposed event against the current objective, Phase,
      expected state, bounds, and allowed references; Forge does not classify
      every message itself.
  freshness_and_conflict:
    - "a Work Focus is current only for its exact active objective revision and compatible Phase"
    - "updates use expected-state comparison so two agents cannot silently overwrite the focus"
    - "objective replacement makes the prior focus stale until explicitly carried forward or superseded"
    - "a stale or missing focus is reported; it is never silently repaired from chat or filesystem guesses"
    - "a conflicting update is rejected before it becomes durable state and returns a typed conflict diagnostic"
  authority:
    classification: "advisory_read_only"
    rules:
      - "Work Focus does not authorize file mutation, phase transition, evidence admission, completion, merge, publication, or release"
      - "selected_practice_ref is guidance and cannot be confused with selected_policy_ref"
      - "external_work_item_ref is a navigation link, not proof of issue state or human acceptance"
      - "current_work next_step is advice composed from current state; exact governed actions remain separate"
  reuse_and_non_owners:
    reuse:
      - "active cooperative objective and its revision"
      - "canonical Phase and Product Journey Guidance"
      - "durable decision and blocker records"
      - "cooperative evidence summaries and ranked governed actions"
      - "GuideDecision validation when a catalog practice is proposed"
    do_not_use_as_owner:
      - id: "OperationContract"
        reason: "it carries execution authority and is much heavier than continuity readback"
      - id: "CheckpointContract"
        reason: "it models run rewind/resume anchors and is currently parse-only, not the normal product journey"
      - id: "AgentRun.current_task"
        reason: "it describes an agent run, not the user-facing product work shared across agents"
      - id: "GitHub Issue"
        reason: "Forge must remain host- and tracker-neutral; an issue may be referenced but not required"
  acceptance_journeys:
    - id: "same-agent-ordinary-message"
      expected: "no durable write and no extra semantic preflight"
    - id: "same-agent-material-correction"
      expected: "the host proposes one bounded update; Forge rejects stale expected state and accepts an exact current update"
    - id: "replacement-agent"
      expected: "one start/resume explains the objective, stage, active focus, accepted practice, blockers, and next step without chat history"
    - id: "replacement-agent-quick-cycle"
      expected: "one resume plus progressive Current Work detail recovers the compactness reason, five accepted closeouts, and expansion history; exact predecessor detail is followed only when the current focus links to a prior cycle"
    - id: "external-issue"
      expected: "the focus can reference a GitHub issue, local ticket, or no tracker while preserving identical Forge semantics"
    - id: "objective-replaced"
      expected: "the old focus becomes visibly stale and is not carried into the new objective by accident"
    - id: "two-agents-conflict"
      expected: "concurrent focus updates use exact expected state; one wins and the other receives a typed conflict"
  performance_budget:
    - "no filesystem documentation scan during start or resume"
    - "no model call inside Forge core"
    - "no semantic reroute on every message"
    - "one bounded summary during ordinary resume; detail only on demand"
    - "focused tests must measure payload bounds and prove that unchanged conversation causes no write"
  delivery_slices:
    - id: "PJ-005A"
      name: "Current Work contract and ledger design"
      done_when:
        - "typed Work Focus event and Current Work readback shapes are bounded and deny unknown fields"
        - "epoch, backward read compatibility, supersession, and expected-state rules are explicit"
        - "no CLI behavior changes"
    - id: "PJ-005B"
      name: "Current Work projection in resume"
      depends_on: ["PJ-005A"]
      done_when:
        - "resume composes one bounded summary from existing durable owners"
        - "absent, current, stale, completed, and abandoned states are projected without selected-policy influence"
        - "blocked remains a closed contract state but is not emitted until PJ-005C binds exact blocker records to the accepted focus"
        - "a present summary publishes one exact argv for bounded read-only detail on demand"
        - "workflow_resume_summary_v8 and its exact consumers advance together"
    - id: "PJ-005C"
      name: "Event-driven focus update and reference diagnostics"
      depends_on: ["PJ-005B"]
      done_when:
        - "the host can propose an accepted semantic update with exact expected state"
        - "ordinary unchanged conversation requires no update"
        - "the existing detail readback resolves explicitly bound decision, blocker, and evidence references"
    - id: "PJ-005D"
      name: "Replacement-agent dogfood journey"
      depends_on: ["PJ-005C"]
      done_when:
        - "an isolated replacement agent continues Forge's own active issue without chat history"
        - "the journey proves no every-message preflight and no project documentation scan"
        - "focused timings and payload sizes stay within the accepted budgets"
    - id: "PJ-008A"
      name: "Quick Cycle ownership and bounded contract"
      depends_on: ["PJ-005D"]
      done_when:
        - "OD-005 resolves Work Focus as the single task-local owner"
        - "write triggers, append-only expansion, compatibility, authority, and unchanged budgets are explicit"
        - "no runtime or CLI behavior changes"
    - id: "PJ-008B1"
      name: "Quick Cycle typed contract and wire compatibility"
      depends_on: ["PJ-008A"]
      done_when:
        - "the internal Work Focus event snapshot is typed, bounded, denies unknown fields, and creates no second state owner"
        - "public current-work command inputs remain unchanged until the kernel can persist every accepted field atomically"
        - "old ledger bytes and hashes remain unchanged and old events project Quick Cycle as not recorded"
        - "the first Quick Cycle-bearing Work Focus selects the next ledger wire after 0.16"
    - id: "PJ-008B2"
      name: "Quick Cycle kernel persistence"
      depends_on: ["PJ-008B1"]
      done_when:
        - "typed Work Focus start, update, completion, and supersession inputs remain bounded and deny unknown fields"
        - "the typed supersession input can atomically carry the new Quick Cycle snapshot and final top-level blocker and evidence sets"
        - "a normal compact task uses accept plus one atomic terminal closeout and final-reference write"
        - "same-focus updates preserve expansion-history prefix under exact expected state"
        - "a new focus_id starts a new cycle and objective replacement leaves the prior focus stale"
        - "the fifth accepted expansion atomically supersedes the full partial cycle, becomes entry one of the new cycle, and carries final top-level references without a completion or bind-reference write"
    - id: "PJ-008B3"
      name: "Quick Cycle progressive readback"
      depends_on: ["PJ-008B2"]
      done_when:
        - "resume adds only bounded derived Quick Cycle state and counts"
        - "existing Current Work detail returns the full explicitly recorded closeouts and expansion history"
        - "detail can resolve one exact predecessor record by published digest without listing or replaying history"
        - "resume, detail, installed skill, and exact consumers advance versions together"
    - id: "PJ-008C"
      name: "Quick Cycle installed dogfood"
      depends_on: ["PJ-008B3"]
      done_when:
        - "one real small Forge task completes without per-stage writes or large artifacts"
        - "one local-looking task records an Expansion Signal and expands only the affected stage"
        - "one bounded-overflow case preserves the fifth reason through a single supersession without synthetic closeouts"
        - "an isolated replacement host recovers compact and expanded work, following exact predecessor detail only when published"
        - "timings, payloads, WAL events, staging, backups, temporary files, and build-cache effects are audited"
    - id: "PJ-009A"
      name: "Live operational guidance separated from frozen retirement evidence"
      depends_on: ["PJ-008C"]
      done_when:
        - "surviving operational workflows may evolve while their IDs remain the exact complement of the admitted retired set"
        - "the frozen legacy catalog remains immutable retirement evidence protected by its manifest hashes"
        - "start, practice selection, lifecycle routing, and adversarial challenge use current public Forge sources with distinct roles"
        - "operational guidance does not reference retired hand-authored state or sprint files"
        - "guide status and detail remain bounded read-only catalog operations without a second store or catalog layer"
    - id: "PJ-007A"
      name: "Bounded collaboration plan contract"
      depends_on: ["PJ-005D"]
      done_when:
        - "Work Focus optionally owns only lane outcomes, dependencies, and isolation links"
        - "lane count, dependency count, outcome bytes, identifiers, and the unchanged Work Focus event budget are explicit"
        - "claim, isolation, promotion, and AgentRun are not duplicated as collaboration state"
        - "historical Work Focus events remain valid when the plan is absent"
    - id: "PJ-007B"
      name: "Atomic collaboration persistence"
      depends_on: ["PJ-007A"]
      done_when:
        - "typed start, update, completion, and supersession inputs can carry the complete bounded plan atomically"
        - "updates use exact expected Work Focus state and validate dependency and isolation references"
        - "ordinary messages, tests, tool calls, progress narration, and heartbeats create no writes"
        - "the first collaboration-bearing Work Focus selects the next ledger wire while frozen records keep their bytes and hashes"
    - id: "PJ-007C"
      name: "Progressive collaboration readback and guidance"
      depends_on: ["PJ-007B"]
      done_when:
        - "resume adds only bounded lane counts and one derived next-ready lane"
        - "Current Work detail returns exact lanes, dependencies, links, and state derived from claims, isolations, and promotions"
        - "readback reuses state already loaded for resume and adds no repository or documentation scan"
        - "start-forge parallelizes only independent work and uses promotion-safe worktree paths"
        - "promotion-ineligible worktree paths are rejected or clearly flagged before active work begins"
    - id: "PJ-007D"
      name: "Installed multi-agent dogfood"
      depends_on: ["PJ-007C"]
      done_when:
        - "two isolated agents complete disjoint Forge lanes while a conflicting cross-lane write is blocked"
        - "a dependent lane stays unready until its predecessor is integrated"
        - "promotion receipts and a fresh replacement host recover the same collaboration result"
        - "timings, payloads, WAL events, staging, worktrees, temporary files, and build-cache effects are audited"

first_vertical_slice:
  name: "Discovery guidance through normal resume"
  scope:
    - "accepted lifecycle descriptor and typed loader"
    - "ProductJourneyGuidance pure derivation for 1-discovery"
    - "workflow_resume_summary_v7 journey_guidance projection"
    - "guide status summary field"
    - "guide detail single-workflow readback"
    - "start-forge v7 consumption"
  explicit_deferrals:
    - "durably recording the host-selected capability"
    - "simplifying GuideDecision validation independently of OperationContract"
    - "automatic semantic ranking inside Forge core"
    - "new workflow authoring or restoration of retired workflows"
    - "Evolve-to-Discovery state transition implementation"
    - "collaboration lanes and merge coordination"
  acceptance_journeys:
    - id: "small-brownfield-fix"
      setup: "a clear local and reversible correction with an existing product"
      expected: "Analysis and Discovery is visible but closes after a compact inspection; no forced market or domain research"
    - id: "medium-feature"
      setup: "a feature with known audience but product and technical uncertainty"
      expected: "the host uses status and one or two details, asks focused questions, and records targeted research before Product Planning"
    - id: "uncertain-product-idea"
      setup: "a broad idea with unclear audience, problem, or alternatives"
      expected: "the host selects expanded brainstorming, design-thinking, or market research before proposing Product Planning"
    - id: "replacement-agent"
      setup: "a new host agent starts from durable Forge state"
      expected: "one start/resume tells it the current stage and how to consult the installed catalog without reading this specification"
    - id: "quick-cycle-expands"
      setup: "a local-looking change reveals a cross-system or architectural consequence during inspection"
      expected: "the host records the expansion signal, expands Solution Definition, and preserves the earlier stage closeouts instead of restarting or implementing blindly"
    - id: "review-returns-upstream"
      setup: "validation proves that the implementation matches the plan but the plan misunderstood the user's intended behavior"
      expected: "the cycle returns to Product Planning or Analysis and Discovery; repeated implementation patches are not treated as progress"

verification_strategy:
  fast_checks_each_slice:
    target: "under 60 seconds on the developer Windows machine after the target is built"
    checks:
      - "contract round-trip and deny-unknown-fields tests for the new typed lifecycle and guidance values"
      - "pure decisions tests for all seven Phase mappings, funnel equality, eligibility count, stable ordering, and 2048-byte compactness"
      - "guide unit tests for status summaries, one detail success, unknown ID, and retired ID"
      - "workflow resume projection unit test proving journey guidance is independent of selected policy"
      - "start-forge Rust contract test for progressive v10 consumption and current compatibility"
  integration_once_at_slice_close:
    - "one focused CLI journey from start to resume in Discovery"
    - "one guide status plus guide detail exercise through the installed-style binary"
    - "one schema-consumer check covering release smoke and shipped start-forge skill"
  not_each_small_edit:
    - "workspace-wide Cargo tests"
    - "full release workflow"
    - "expensive domain-pack or P6d E2E"
    - "fuzzing"
  broader_release_gate:
    - "cargo fmt --all -- --check"
    - "relevant crate tests"
    - "release locking and smoke checks in a supported environment"
    - "hosted CI before release claims"

implementation_slices:
  - id: "PJ-001"
    name: "Canonical lifecycle descriptors"
    done_when:
      - "one accepted lifecycle contract covers every canonical Phase"
      - "decisions loader validates uniqueness, completeness, contact density, and bounds"
      - "no transition or authority behavior changes"
  - id: "PJ-002"
    name: "Progressive catalog readback"
    depends_on: ["PJ-001"]
    done_when:
      - "guide status returns bounded summaries in stable order"
      - "guide detail returns exactly one operational workflow"
      - "unknown and retired IDs fail with distinct typed diagnostics"
  - id: "PJ-003"
    name: "Journey guidance in resume v7"
    depends_on: ["PJ-001", "PJ-002"]
    done_when:
      - "resume returns the compact stage and exact progressive catalog commands"
      - "output is independent of selected policy and remains under the size bound"
      - "v7 schema consumers are updated together"
  - id: "PJ-004"
    name: "Single-command host experience"
    depends_on: ["PJ-003"]
    done_when:
      - "start-forge consumes v7 without embedding the catalog"
      - "v6 compatibility stays honest"
      - "the four acceptance journeys have focused evidence"
  - id: "PJ-005"
    name: "Current Work Continuity"
    depends_on: ["PJ-004"]
    deferred_from_first_slice: true
    objective: >-
      let a replacement agent recover the bounded work in progress, including
      an accepted practice when present, without replaying chat or turning
      continuity into authority
    split_into: ["PJ-005A", "PJ-005B", "PJ-005C", "PJ-005D"]
  - id: "PJ-006"
    name: "Evolve reentry"
    depends_on: ["PJ-004"]
    deferred_from_first_slice: true
    objective: "make a user-triggered stable-product change reenter Analysis and Discovery with prior product context"
  - id: "PJ-007"
    name: "Collaboration lanes"
    depends_on: ["PJ-004"]
    deferred_from_first_slice: true
    objective: "connect lifecycle work to agent ownership, dependencies, integration, and merge evidence"
    split_into: ["PJ-007A", "PJ-007B", "PJ-007C", "PJ-007D"]
  - id: "PJ-008"
    name: "Quick Cycle Continuity"
    depends_on: ["PJ-005"]
    objective: >-
      preserve proportional lifecycle closeouts and accepted expansion history
      inside Work Focus without another state authority or per-stage overhead
    split_into: ["PJ-008A", "PJ-008B1", "PJ-008B2", "PJ-008B3", "PJ-008C"]

compatibility_and_rollout:
  - "Keep current Phase tags and ranks byte-for-byte stable."
  - "Do not reinterpret old workflow, ledger, policy, or release records."
  - "Advance guide routing payload 0.2 to 0.3 because status row meaning changes."
  - "Advance resume summary v6 to v7 because a required public field is added."
  - "Update release smoke and its governed hash together with the shipped start-forge consumer."
  - "Do not edit a content-addressed workflow-governance bundle merely to add advisory journey wording."
  - "Roll back by removing the new read-only projection and returning adapters to v6; no persisted-data migration is required in the first slice."
  - "The first Work Focus event carrying Quick Cycle data advances the ledger wire after 0.16; frozen earlier records and digests remain byte-identical."
  - "Quick Cycle is optional on historical Work Focus events and absence means not recorded, never inferred from current_activity or acceptance_summary."
  - "Adding required Quick Cycle summary fields advances workflow resume beyond v8; adding full closeouts advances Current Work detail beyond v1, and exact consumers update together."
  - "No separate migration writes old Quick Cycle history; replacement hosts receive an honest not-recorded result."
  - "The first collaboration-bearing Work Focus advances the ledger wire after 0.17; frozen earlier records and digests remain byte-identical."

success_metrics:
  product:
    - "the human still uses one initialization command"
    - "the host can state the current product stage and its objective after one resume"
    - "small work is not forced into unnecessary research or large artifacts"
    - "uncertain work receives useful discovery practices before implementation"
    - "a replacement host can recover how to continue from runtime readback"
  efficiency:
    - "journey_guidance is at most 2048 canonical JSON bytes"
    - "zero full-catalog payloads during ordinary startup"
    - "at most one status call and only selected detail calls during a stage decision"
    - "fast checks remain under the stated local target after build"
  safety:
    - "no change to governance verdicts when only lifecycle wording or workflow steps change"
    - "no recommendation grants mutation or phase authority"

open_decisions_before_implementation:
  - id: "OD-001"
    question: "Are the stage display names and objectives in canonical_stage_mapping accepted as the first product wording?"
    blocking: true
  - id: "OD-002"
    question: "Should guide detail use the installed embedded catalog unconditionally, or preserve the current explicit local --catalog-dir developer override?"
    recommendation: "preserve the explicit developer override while defaulting to the embedded installed catalog"
    blocking: false
  - id: "OD-004"
    question: "Which admitted transition implements Evolve reentry without weakening ReadyOperate and release gates?"
    blocking: false
    deferred_to: "PJ-006"

resolved_product_decisions:
  - id: "PD-001"
    accepted_at: "2026-08-13"
    decision: >-
      Evolve is a short transition after a stable product. It records the
      user's material-change intent and immediately opens a new Product
      Lifecycle in Analysis and Discovery. Development does not happen in
      Evolve.
  - id: "PD-002"
    accepted_at: "2026-08-13"
    decision: >-
      Forge has one Product Lifecycle with proportional depth. Small work uses
      a Quick Cycle that compresses every lifecycle stage into one durable
      record instead of skipping stages. Concrete uncertainty, impact, risk, or
      review evidence expands only the affected stage by default, and failures
      return to the stage where the misunderstanding originated.
  - id: "PD-003"
    accepted_at: "2026-08-16"
    decision: >-
      Continuity is restored as an event-driven Current Work Context, not as a
      semantic preflight on every message. Forge persists only accepted changes
      to a bounded Work Focus, composes existing durable state into a progressive
      readback, and leaves interpretation to the host agent. Selected practice
      is one optional part of that context, never authority.
  - id: "PD-004"
    accepted_at: "2026-08-24"
    resolves: "OD-005"
    decision: >-
      Work Focus owns the bounded task-local Quick Cycle snapshot in the
      existing workflow-governance WAL. Ordinary compact work records the five
      closeouts together in its terminal Work Focus update; intermediate writes
      occur only for an accepted Expansion Signal or real replacement boundary.
      A material correction starts a new focus_id and objective revisions remain
      owned by Cooperative Objective. Canonical Phase, decisions, evidence,
      policies, and release authority remain separate owners and are never
      copied or implied.
  - id: "PD-005"
    accepted_at: "2026-08-24"
    resolves: "OD-006"
    decision: >-
      Work Focus entered the workflow-governance ledger at 0.15 and explicit
      blocker/evidence bindings advance successors to 0.16. Frozen older bytes
      remain readable and unchanged; the first Quick Cycle-bearing record must
      select a new wire after 0.16.
  - id: "PD-006"
    accepted_at: "2026-08-24"
    resolves: "OD-007"
    decision: >-
      Current Work summary remains bounded to 8 KiB, detail to 20 KiB, and a
      Work Focus event to 16 KiB. Quick Cycle allocates sub-bounds inside those
      limits and may not increase them without new measured installed-runtime
      evidence and an explicit product decision.

acceptance_boundary: >-
  This draft specifies the intended product interface and implementation
  slices. It grants no implementation authority and makes no claim that the
  runtime, installed skill, release smoke, or user journeys already implement
  Product Journey Guidance.
