[package]
name = "forge-desktop"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Stable Studio"]
description = "Independent desktop companion for Forge"
publish = false

# Keep UI dependencies and its lockfile out of the core's build graph.
[workspace]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["std"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0
incremental = false
